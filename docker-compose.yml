services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicut}
      POSTGRES_USER: ${POSTGRES_USER:-aicut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicut}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicut} -d ${POSTGRES_DB:-aicut}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicut-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_PATH: ./apps/api
        BIN_NAME: aicut-api
    container_name: aicut-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_ADDR: ${API_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://aicut:aicut@postgres:5432/aicut?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/storage}
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-120}
      ASR_BASE_URL: ${ASR_BASE_URL:-http://asr:10096}
      ASR_REQUEST_TIMEOUT_SECONDS: ${ASR_REQUEST_TIMEOUT_SECONDS:-300}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_PATH: ./apps/worker
        BIN_NAME: aicut-worker
    container_name: aicut-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      DATABASE_URL: ${DATABASE_URL:-postgres://aicut:aicut@postgres:5432/aicut?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/storage}
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-120}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  asr:
    build:
      context: .
      dockerfile: deploy/asr/Dockerfile
      args:
        ASR_BASE_IMAGE: ${ASR_BASE_IMAGE:-nvidia/cuda:12.6.3-base-ubuntu22.04}
        APT_MIRROR: ${ASR_APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/ubuntu}
        PIP_INDEX_URL: ${ASR_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        HTTP_PROXY: ${MODEL_DOWNLOAD_PROXY:-}
        HTTPS_PROXY: ${MODEL_DOWNLOAD_PROXY:-}
        http_proxy: ${MODEL_DOWNLOAD_PROXY:-}
        https_proxy: ${MODEL_DOWNLOAD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1,postgres,redis,api,worker
        no_proxy: localhost,127.0.0.1,postgres,redis,api,worker
    container_name: aicut-asr
    restart: unless-stopped
    environment:
      ASR_MODEL: ${ASR_MODEL:-paraformer-zh}
      ASR_VAD_MODEL: ${ASR_VAD_MODEL:-fsmn-vad}
      ASR_PUNC_MODEL: ${ASR_PUNC_MODEL:-ct-punc-c}
      MODELSCOPE_CACHE: /models
      HTTP_PROXY: ${MODEL_DOWNLOAD_PROXY:-}
      HTTPS_PROXY: ${MODEL_DOWNLOAD_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,api,worker
    ports:
      - "${ASR_BIND_ADDR:-127.0.0.1}:${ASR_PORT:-10096}:10096"
    volumes:
      - asr-models:/models
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10096/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 10m

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: aicut-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - worker
      - node-exporter
      - cadvisor

  grafana:
    image: docker.1panel.live/grafana/grafana:12.0.1
    container_name: aicut-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: aicut-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:0.54.0
    container_name: aicut-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  asr-models:
